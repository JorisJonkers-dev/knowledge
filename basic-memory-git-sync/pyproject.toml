[project]
name = "basic-memory-git-sync"
version = "0.1.0"
description = "Git commit backstop for the Basic Memory vault: watches the shared working tree and commits + pushes the notes Basic Memory writes, surfacing (never silently resolving) concurrent-edit conflicts."
requires-python = "==3.14.7"
dependencies = [
  # Git plumbing for the vault clone. Same library the ingest-worker's
  # VaultGitWriter uses, so the two vault writers behave identically.
  "gitpython==3.1.62",
  # Structured logging, matching the ingest-worker and Spring services.
  "structlog==25.5.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "pytest-cov==6.3.0",
  "pytest-timeout==2.4.0",
  "ruff==0.16.6",
  "mypy==1.20.2",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basic_memory_git_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config --timeout=60"

[tool.coverage.run]
source = ["src/basic_memory_git_sync"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E", "F", "W",
  "I",
  "B",
  "UP",
  "SIM",
  "ANN",
  "RUF",
]
ignore = [
  "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/basic_memory_git_sync"]