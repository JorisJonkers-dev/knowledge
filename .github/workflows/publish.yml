# Tag-triggered publish flow for knowledge.
#
# push of a v*.*.* tag drives:
#   publish-api-image \
#                      -> resolve-image-lock -> publish-deploy-artifact -> register-service
#   publish-worker-image /
#
# Two images (knowledge-api, knowledge-ingest-worker) are built in parallel and
# their digests are merged into a single platform/images.lock.json before the
# deploy artifact is rendered.
#
# Boundary rule (R1-2): the image lock crosses the reusable-workflow boundary
# as an UPLOADED ARTIFACT (image-lock-artifact), never as a runner-local path.
name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.3.0)'
        required: true
        type: string

permissions: {}

jobs:
  # -- 1a. Build and push knowledge-api image --------------------------------
  publish-api-image:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/container-publish.yml@4b444f9a50edf76e4aea4148d73407c34a1e43a4 # v0.12.1
    with:
      platforms: linux/amd64,linux/arm64
      image-name: knowledge/knowledge-api
      dockerfile: api/Dockerfile
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    permissions:
      contents: read
      packages: write

  # -- 1b. Build and push knowledge-ingest-worker image ----------------------
  publish-worker-image:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/container-publish.yml@4b444f9a50edf76e4aea4148d73407c34a1e43a4 # v0.12.1
    with:
      platforms: linux/amd64,linux/arm64
      image-name: knowledge/knowledge-ingest-worker
      dockerfile: ingest-worker/Dockerfile
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    permissions:
      contents: read
      packages: write

  # -- 2. Resolve the image lock (upload artifact, never path) --------------
  resolve-image-lock:
    needs: [publish-api-image, publish-worker-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      images-lock-artifact: images-lock-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: resolve-api-digest
        id: api-digest
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/jorisjonkers-dev/knowledge/knowledge-api
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          digest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r '.digest')"
          if [ -z "$digest" ] || [ "$digest" = "null" ]; then
            echo "E_FLOATING_IMAGE: could not resolve a digest for ${IMAGE}:${TAG}" >&2
            exit 1
          fi
          echo "image-digest=$digest" >> "$GITHUB_OUTPUT"

      - name: resolve-worker-digest
        id: worker-digest
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/jorisjonkers-dev/knowledge/knowledge-ingest-worker
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r '.digest')"
          if [ -z "$digest" ] || [ "$digest" = "null" ]; then
            echo "E_FLOATING_IMAGE: could not resolve a digest for ${IMAGE}:${TAG}" >&2
            exit 1
          fi
          echo "image-digest=$digest" >> "$GITHUB_OUTPUT"

      - name: lock-images
        env:
          API_DIGEST: ${{ steps.api-digest.outputs.image-digest }}
          WORKER_DIGEST: ${{ steps.worker-digest.outputs.image-digest }}
        run: |
          set -euo pipefail
          for digest in "$API_DIGEST" "$WORKER_DIGEST"; do
            case "$digest" in
              sha256:*) ;;
              *) echo "E_FLOATING_IMAGE: digest is not a digest ref (got: $digest)" >&2; exit 1 ;;
            esac
          done
          printf '{"knowledge-api":"ghcr.io/jorisjonkers-dev/knowledge/knowledge-api@%s","knowledge-ingest-worker":"ghcr.io/jorisjonkers-dev/knowledge/knowledge-ingest-worker@%s"}\n' \
            "$API_DIGEST" "$WORKER_DIGEST" > platform/images.lock.json
          echo "Locked api: ghcr.io/jorisjonkers-dev/knowledge/knowledge-api@${API_DIGEST}"
          echo "Locked worker: ghcr.io/jorisjonkers-dev/knowledge/knowledge-ingest-worker@${WORKER_DIGEST}"

      - name: verify-lock
        run: |
          set -euo pipefail
          for key in knowledge-api knowledge-ingest-worker; do
            ref=$(jq -r --arg k "$key" '.[$k]' platform/images.lock.json)
            case "$ref" in
              *@sha256:*) echo "Digest pin verified: $ref" ;;
              *) echo "E_FLOATING_IMAGE: lock ref for $key is not digest-pinned: $ref" >&2; exit 1 ;;
            esac
          done

      - name: upload-image-lock
        uses: actions/upload-artifact@v5
        with:
          name: images-lock-${{ github.run_id }}
          path: platform/images.lock.json
          retention-days: 1

  # -- 3. Render and publish the deploy artifact ----------------------------
  publish-deploy-artifact:
    needs: [resolve-image-lock]
    uses: JorisJonkers-dev/github-workflows/.github/workflows/deploy-artifact.yml@ea7a9a1c52870c2ae3db08cd077d54dbef48aa3d # v0.14.0
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      artifact-name: knowledge
      artifact-version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      schema-version: 0.20.0
      apply-bundle: true
      context-ref: ghcr.io/jorisjonkers-dev/cluster-deploy-context-public@sha256:9479bc22ae11183c0b68f257d2c1a21455be8c3cff602d3a491ea3ff31d01fe3
      deploy-dir: platform
      image-lock-artifact: ${{ needs.resolve-image-lock.outputs.images-lock-artifact }}
      environments: production
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
