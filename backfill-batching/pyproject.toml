[project]
name = "knowledge-backfill-batching"
version = "0.1.0"
description = "Resumable, deduplicating batch backfill driver for the transcript corpus into Hindsight (fleet-infra#249). Pure stdlib: runs without a cluster, against any .jsonl corpus. Proof-of-protocol, not the enablement hook."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9",
  "pytest-cov>=5.0.0,<7",
  "pytest-timeout>=2.3.0,<3",
  "ruff>=0.6.0,<1",
  "mypy>=1.11.0,<2",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backfill_batching"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config --timeout=60"

[tool.coverage.run]
source = ["src/backfill_batching"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E", "F", "W",
  "I",
  "B",
  "UP",
  "SIM",
  "ANN",
  "RUF",
]
ignore = [
  "ANN401",
]

[tool.ruff.lint.per-file-ignores]

"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/backfill_batching"]