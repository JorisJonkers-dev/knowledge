[project]
name = "knowledge-note-import"
version = "0.1.0"
description = "Standalone CLI that imports curated notes from a source git vault (the knowledge-vault) into the Basic Memory note format: walks the tree without flattening, preserves git lineage, classifies evidence-backed vs legacy-derived, dedupes on re-run, and archives original bytes to a content-addressed store layout."
requires-python = ">=3.12"
dependencies = [
  # Git plumbing for per-file lineage (the same library the ingest-worker
  # and basic-memory-git-sync use, so all three vault git actors behave
  # identically).
  "gitpython>=3.1.50",
  # Structured logging, matching the ingest-worker's JSON shape.
  "structlog>=24.4.0,<26",
  # YAML frontmatter parsing / re-serialisation. Parsed with round-trip
  # fidelity so upstream-native syntax survives the note-format mapping.
  "pyyaml>=6.0.1,<7",
]

[project.scripts]
note-import = "note_import.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9",
  "pytest-cov>=5.0.0,<7",
  "pytest-timeout>=2.3.0,<3",
  "ruff>=0.6.0,<1",
  "mypy>=1.11.0,<2",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/note_import"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config --timeout=60"

[tool.coverage.run]
source = ["src/note_import"]
branch = true

[tool.coverage.report]
# Same 80 % floor the ingest-worker enforces.
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E", "F", "W",
  "I",
  "B",
  "UP",
  "SIM",
  "ANN",
  "RUF",
]
ignore = [
  "ANN401",  # `Any` is sometimes the honest annotation (e.g. YAML payloads).
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/note_import"]

# PyYAML ships no py.typed marker. Treat its imports as Any rather than
# block strict mode on a transitive library limitation.
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true